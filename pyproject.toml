[project]
name = "finnreader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8", "pymupdf>=1.24", "deep-translator>=1.11", "pyyaml>=6"]

[project.optional-dependencies]
# offline translation with opus-mt (MarianMT)
offline = ["transformers>=4.40", "torch>=2.3", "sentencepiece>=0.2", "sacremoses>=0.1"]

[project.scripts]
finnreader = "finnreader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CPU-only torch: avoids pulling several GB of CUDA libraries
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
# standalone apps for Linux, macOS and Windows: see packaging/README.md
build = ["pyinstaller>=6.10"]
